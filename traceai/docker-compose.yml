services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: traceai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traceai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traceai}
      POSTGRES_DB: ${POSTGRES_DB:-traceai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: traceai-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: traceai-clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: traceai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-traceai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-traceai123}
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
      - "${MINIO_PORT:-9002}:9000"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  minio_data:
