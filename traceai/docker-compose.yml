services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: traceai-postgres
    environment:
      POSTGRES_USER: traceai
      POSTGRES_PASSWORD: traceai
      POSTGRES_DB: traceai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: traceai-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: traceai-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: traceai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: traceai
      MINIO_ROOT_PASSWORD: traceai123
    ports:
      - "9001:9001"
      - "9002:9000"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  minio_data: